<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alora</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Outfit",system-ui,-apple-system,sans-serif;color:#fff;background:#0A2238 url(/assets/splash.jpg) center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top,0px)) 28px calc(40px + env(safe-area-inset-bottom,0px))}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,20,38,.4),rgba(4,20,38,0) 30%,rgba(4,20,38,.1) 50%,rgba(4,20,38,.85))}
  body>*{position:relative}
  img{height:32px;width:auto}
  h1{font-weight:200;font-size:46px;letter-spacing:-.035em;line-height:1.04;margin:0;max-width:11ch}
  p{font-weight:300;font-size:17px;opacity:.9;margin:14px 0 0;max-width:34ch}
</style>
</head>
<body>
  <img src="/assets/logo-white.png" alt="Alora">
  <div><h1>Your home, taken care of.</h1><p>Open the private link we texted you to see your home, your visits and your team.</p></div>
</body>
</html>
